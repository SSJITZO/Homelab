<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title   { font-size: 21px; font-weight: 700; fill: #202124; }
    .sub     { font-size: 12px; fill: #5f6368; }
    .devtitle{ font-size: 14px; font-weight: 700; fill: #ffffff; }
    .devmeta { font-size: 10.5px; fill: #d2e3fc; }
    .portnum { font-size: 11px; font-weight: 700; }
    .portname{ font-size: 11.5px; font-weight: 600; fill: #202124; }
    .portmeta{ font-size: 9.5px; fill: #5f6368; }
    .grouptitle { font-size: 13px; font-weight: 700; fill: #3c4043; }
    .note    { font-size: 10.5px; fill: #5f6368; }
    .p-uplink { fill: #fdeceb; stroke: #ea6b5e; }
    .p-mgmt   { fill: #eef0f2; stroke: #9aa0a6; }
    .p-servers{ fill: #e0f7f3; stroke: #12a594; }
    .p-trusted{ fill: #e8f0fe; stroke: #4285f4; }
    .p-lab    { fill: #f3e8fd; stroke: #9334e6; }
    .p-poe    { fill: #fff3cd; stroke: #e0a200; }
    .p-empty  { fill: #fafafa; stroke: #dadce0; stroke-dasharray: 4 3; }
    .p-planned{ fill: #fafafa; stroke: #9aa0a6; stroke-dasharray: 2 3; }
    .box rect { stroke-width: 1.5; }
    .line { stroke: #bdc1c6; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="980" height="900" fill="#ffffff"/>
  <text class="title" x="30" y="34">Port map — what plugs into what (new home)</text>
  <text class="sub"   x="30" y="52">Comcast/Xfinity modem &#8594; UCG-Fiber gateway (&#8220;GOAT&#8221;) &#8594; Pro XG 8 PoE (core) &#8594; Flex 2.5G PoE (access) &#183; single-level layout, no downstairs/upstairs split</text>

  <!-- ============ UCG-FIBER GATEWAY ============ -->
  <rect x="30" y="76" width="920" height="40" rx="8" fill="#1a73e8"/>
  <text class="devtitle" x="46" y="102">UniFi UCG-Fiber &#8212; gateway (named &#8220;GOAT&#8221; in controller)</text>

  <g class="box p-uplink"><rect x="30" y="126" width="140" height="56" rx="6"/>
    <text class="portnum" x="38" y="144" fill="#8a2c22">Port 5 (RJ45, PoE+)</text>
    <text class="portname" x="38" y="160">&#8592; Comcast Cable</text>
    <text class="portmeta" x="38" y="173">Xfinity modem &#183; WAN in</text></g>
  <g class="box p-empty"><rect x="180" y="126" width="140" height="56" rx="6"/>
    <text class="portnum" x="188" y="144" fill="#80868b">Ports 1&#8211;3</text>
    <text class="portname" x="188" y="160">Open</text>
    <text class="portmeta" x="188" y="173">iPhone/PS4 formerly here, now disconnected</text></g>
  <g class="box p-empty"><rect x="330" y="126" width="140" height="56" rx="6"/>
    <text class="portnum" x="338" y="144" fill="#80868b">Port 4 (PoE+)</text>
    <text class="portname" x="338" y="160">Open</text>
    <text class="portmeta" x="338" y="173">spare PoE+ port</text></g>
  <g class="box p-empty"><rect x="480" y="126" width="140" height="56" rx="6"/>
    <text class="portnum" x="488" y="144" fill="#80868b">SFP+ 1</text>
    <text class="portname" x="488" y="160">Open</text>
    <text class="portmeta" x="488" y="173">reserved for future fiber</text></g>
  <g class="box p-uplink"><rect x="630" y="126" width="140" height="56" rx="6"/>
    <text class="portnum" x="638" y="144" fill="#8a2c22">SFP+ 2</text>
    <text class="portname" x="638" y="160">&#8594; Pro XG, port 9</text>
    <text class="portmeta" x="638" y="173">10G uplink to core switch</text></g>

  <line class="line" x1="700" y1="182" x2="700" y2="216"/>

  <!-- ============ PRO XG 8 POE — CORE SWITCH ============ -->
  <rect x="30" y="216" width="920" height="40" rx="8" fill="#12a594"/>
  <text class="devtitle" x="46" y="242">UniFi Pro XG 8 PoE &#8212; 10G core switch (8&#215; RJ45 + 2&#215; SFP+)</text>

  <g class="box p-empty"><rect x="30"  y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="38" y="284" fill="#80868b">Port 1</text>
    <text class="portname" x="38" y="299">Open</text>
    <text class="portmeta" x="38" y="312">spare 10G</text></g>
  <g class="box p-servers"><rect x="142" y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="150" y="284" fill="#0b5e54">Port 2</text>
    <text class="portname" x="150" y="299">UGREEN NAS</text>
    <text class="portmeta" x="150" y="312">VLAN 20 &#183; Servers &#183; 192.168.20.0/24</text></g>
  <g class="box p-servers"><rect x="254" y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="262" y="284" fill="#0b5e54">Port 3</text>
    <text class="portname" x="262" y="299">Proxmox (Mini PC)</text>
    <text class="portmeta" x="262" y="312">VLAN 20 &#183; Servers &#183; 192.168.20.0/24</text></g>
  <g class="box p-trusted"><rect x="366" y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="374" y="284" fill="#174ea6">Port 4</text>
    <text class="portname" x="374" y="299">ASUS AP (aiboard)</text>
    <text class="portmeta" x="374" y="312">VLAN 10 &#183; Trusted &#183; AP/bridge mode</text></g>
  <g class="box p-empty"><rect x="478" y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="486" y="284" fill="#80868b">Port 5</text>
    <text class="portname" x="486" y="299">Open</text>
    <text class="portmeta" x="486" y="312">spare 10G</text></g>
  <g class="box p-empty"><rect x="590" y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="598" y="284" fill="#80868b">Port 6</text>
    <text class="portname" x="598" y="299">Open</text>
    <text class="portmeta" x="598" y="312">spare 10G</text></g>
  <g class="box p-mgmt"><rect x="702" y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="710" y="284" fill="#3c4043">Port 7</text>
    <text class="portname" x="710" y="299">Mgmt device</text>
    <text class="portmeta" x="710" y="312">VLAN 1 &#183; Management &#183; admin access</text></g>
  <g class="box p-poe"><rect x="814" y="266" width="106" height="64" rx="6"/>
    <text class="portnum" x="822" y="284" fill="#7a5900">Port 8</text>
    <text class="portname" x="822" y="299">&#8594; Flex 2.5G</text>
    <text class="portmeta" x="822" y="312">PoE ON &#183; powers the Flex</text></g>

  <g class="box p-uplink"><rect x="30" y="338" width="106" height="46" rx="6"/>
    <text class="portnum" x="38" y="356" fill="#8a2c22">SFP+ 9</text>
    <text class="portname" x="38" y="372">&#8592; Gateway, SFP+2</text></g>
  <g class="box p-empty"><rect x="142" y="338" width="106" height="46" rx="6"/>
    <text class="portnum" x="150" y="356" fill="#80868b">SFP+ 10</text>
    <text class="portname" x="150" y="372">Open</text></g>
  <text class="note" x="280" y="363">Laptop currently plugs into the end port of this 10G switch for UniFi management</text>

  <line class="line" x1="643" y1="384" x2="643" y2="416"/>

  <!-- ============ FLEX 2.5G POE — ACCESS SWITCH ============ -->
  <rect x="30" y="416" width="920" height="40" rx="8" fill="#0b5e54"/>
  <text class="devtitle" x="46" y="442">UniFi Flex 2.5G PoE &#8212; access switch (8&#215; 2.5GbE + 1&#215; combo) &#8212; the Pi fleet lives here</text>

  <g class="box p-lab"><rect x="30"  y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="38" y="484" fill="#4a0e8f">Port 1</text>
    <text class="portname" x="38" y="499">Pi 2 (pi2-lab)</text>
    <text class="portmeta" x="38" y="512">VLAN 50 &#183; Lab &#183; Suricata IDS &#8212; LIVE</text></g>
  <g class="box p-trusted"><rect x="142" y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="150" y="484" fill="#174ea6">Port 2</text>
    <text class="portname" x="150" y="499">Pi 1 (pi1-guardian)</text>
    <text class="portmeta" x="150" y="512">VLAN 10 &#183; Trusted &#183; Pi-hole+VPN &#8212; LIVE</text></g>
  <g class="box p-planned"><rect x="254" y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="262" y="484" fill="#5f6368">Port 3</text>
    <text class="portname" x="262" y="499">Pi 3 &#8212; not built</text>
    <text class="portmeta" x="262" y="512">planned: Vaultwarden/Nextcloud</text></g>
  <g class="box p-planned"><rect x="366" y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="374" y="484" fill="#5f6368">Port 4</text>
    <text class="portname" x="374" y="499">Pi 4 &#8212; not built</text>
    <text class="portmeta" x="374" y="512">planned: Grafana/Prometheus</text></g>
  <g class="box p-mgmt"><rect x="478" y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="486" y="484" fill="#3c4043">Port 5</text>
    <text class="portname" x="486" y="499">JetKVM</text>
    <text class="portmeta" x="486" y="512">VLAN 1 &#183; Management &#183; FE (100Mb) link</text></g>
  <g class="box p-empty"><rect x="590" y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="598" y="484" fill="#80868b">Port 6</text>
    <text class="portname" x="598" y="499">Open</text>
    <text class="portmeta" x="598" y="512">future IoT/camera</text></g>
  <g class="box p-empty"><rect x="702" y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="710" y="484" fill="#80868b">Port 7</text>
    <text class="portname" x="710" y="499">Open</text>
    <text class="portmeta" x="710" y="512">spare</text></g>
  <g class="box p-empty"><rect x="814" y="466" width="106" height="64" rx="6"/>
    <text class="portnum" x="822" y="484" fill="#80868b">Port 8</text>
    <text class="portname" x="822" y="499">Open</text>
    <text class="portmeta" x="822" y="512">spare</text></g>

  <g class="box p-uplink"><rect x="30" y="538" width="220" height="46" rx="6"/>
    <text class="portnum" x="38" y="556" fill="#8a2c22">Port 9 &#8212; combo, SFP+/10G</text>
    <text class="portname" x="38" y="572">&#8592; Pro XG, port 8</text></g>
  <text class="note" x="262" y="563">10GbE uplink to the core switch &#8212; one cable carries the uplink AND PoE power</text>

  <!-- Legend -->
  <line x1="30" y1="610" x2="950" y2="610" stroke="#e0e0e0" stroke-width="1"/>
  <text class="grouptitle" x="30" y="632">Legend</text>
  <rect x="30"  y="644" width="13" height="13" rx="3" class="p-uplink"/>
  <text class="portmeta" x="49"  y="655">Uplink / WAN</text>
  <rect x="190" y="644" width="13" height="13" rx="3" class="p-poe"/>
  <text class="portmeta" x="209" y="655">PoE-powered link</text>
  <rect x="350" y="644" width="13" height="13" rx="3" class="p-mgmt"/>
  <text class="portmeta" x="369" y="655">Management VLAN</text>
  <rect x="510" y="644" width="13" height="13" rx="3" class="p-trusted"/>
  <text class="portmeta" x="529" y="655">Trusted VLAN</text>
  <rect x="650" y="644" width="13" height="13" rx="3" class="p-servers"/>
  <text class="portmeta" x="669" y="655">Servers VLAN</text>
  <rect x="790" y="644" width="13" height="13" rx="3" class="p-lab"/>
  <text class="portmeta" x="809" y="655">Lab VLAN (isolated)</text>
  <rect x="30" y="666" width="13" height="13" rx="3" class="p-planned"/>
  <text class="portmeta" x="49" y="677">Planned / not built yet</text>

  <!-- Setup notes -->
  <rect x="30" y="702" width="920" height="176" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <text class="grouptitle" x="46" y="725">What changed with the move</text>
  <text class="note" x="46" y="746">ISP is now Comcast/Xfinity (was AT&amp;T Fiber) &#8212; cable modem feeds straight into the gateway&#8217;s WAN RJ45 port, no separate ISP router in the chain</text>
  <text class="note" x="46" y="763">Single-level apartment &#8212; the old downstairs-ASUS / upstairs-switch split is gone. The ASUS router now runs as a plain AP in bridge mode, wired directly to the core switch</text>
  <text class="note" x="46" y="780">Gateway &#8594; core switch uplink moved from RJ45 10G to SFP+ (both ends), core switch &#8594; access switch uplink is the Flex&#8217;s combo SFP+ port</text>
  <text class="note" x="46" y="797">Pi 1 and Pi 2 are both confirmed live and correctly VLAN-tagged after the move (verified via the Suricata/DNS troubleshooting session). Pi 3 and Pi 4 are still just plans</text>
  <text class="note" x="46" y="814">Don&#8217;t forget, in the UniFi controller: Pro XG port 2&#8211;3 &#8220;Servers&#8221; profile, port 4 &#8220;Trusted&#8221; (PoE off, ASUS has its own brick), port 8 &#8220;All&#8221;/trunk with PoE ON, port 9 (SFP+) &#8220;All&#8221;/trunk to the gateway</text>
  <text class="note" x="46" y="831">Flex 2.5G: port 1 &#8220;Lab&#8221;, port 2 &#8220;Trusted&#8221;, port 5 &#8220;Management&#8221;, port 9 (combo) &#8220;All&#8221;/trunk so every VLAN can pass through the backbone</text>
  <text class="note" x="46" y="848">Verify no port is still on the old profile from before the move &#8212; a leftover tag was the root cause of the Suricata/DNS incident on Pi 2</text>
  <text class="note" x="46" y="865">Laptop at the end port of the 10G switch is for management convenience only, not a permanent device placement</text>
</svg>
