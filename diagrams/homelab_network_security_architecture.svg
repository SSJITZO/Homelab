<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 815" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title   { font-size: 21px; font-weight: 700; fill: #202124; }
    .sub     { font-size: 12px; fill: #5f6368; }
    .colhead { font-size: 12.5px; font-weight: 700; }
    .name    { font-size: 12px; font-weight: 600; fill: #202124; }
    .meta    { font-size: 10px; fill: #5f6368; }
    .gwtitle { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .gwmeta  { font-size: 10.5px; fill: #d2e3fc; }
    .grouptitle { font-size: 12.5px; font-weight: 700; fill: #3c4043; }
    .note    { font-size: 10.5px; fill: #5f6368; }
    .mgmt       { fill: #eef0f2; stroke: #9aa0a6; }
    .mgmt h     { fill: #3c4043; }
    .trusted    { fill: #e8f0fe; stroke: #4285f4; }
    .servers    { fill: #e0f7f3; stroke: #12a594; }
    .reserved   { fill: #fef6e0; stroke: #e0a200; stroke-dasharray: 5 4; }
    .lab        { fill: #f3e8fd; stroke: #9334e6; }
    .box rect { stroke-width: 1.5; }
    .line { stroke: #bdc1c6; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="960" height="815" fill="#ffffff"/>

  <text class="title" x="30" y="34">Homelab network &amp; security architecture</text>
  <text class="sub"   x="30" y="52">VLAN segmentation, gateway enforcement, and per-device firewall layers</text>

  <!-- Internet -->
  <rect x="400" y="68" width="160" height="34" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text class="name" x="480" y="89" text-anchor="middle">Internet (AT&amp;T Fiber)</text>
  <line class="line" x1="480" y1="102" x2="480" y2="120"/>

  <!-- BGW320 -->
  <rect x="400" y="120" width="160" height="34" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text class="name" x="480" y="141" text-anchor="middle">AT&amp;T BGW320 (ISP gateway)</text>
  <line class="line" x1="480" y1="154" x2="480" y2="172"/>

  <!-- UCG-Fiber gateway -->
  <rect x="290" y="172" width="380" height="64" rx="10" fill="#1a73e8"/>
  <text class="gwtitle" x="480" y="198" text-anchor="middle">UniFi UCG-Fiber — Network Firewall</text>
  <text class="gwmeta"  x="480" y="217" text-anchor="middle">VLAN enforcement &#183; 5 Gbps IDS/IPS &#183; 55,000+ threat signatures</text>
  <line class="line" x1="480" y1="236" x2="480" y2="254"/>

  <!-- spread lines to columns -->
  <line class="line" x1="85"  y1="254" x2="480" y2="254"/>
  <line class="line" x1="85"  y1="254" x2="85"  y2="270"/>
  <line class="line" x1="243" y1="254" x2="243" y2="270"/>
  <line class="line" x1="401" y1="254" x2="401" y2="270"/>
  <line class="line" x1="480" y1="254" x2="875" y2="254"/>
  <line class="line" x1="559" y1="254" x2="559" y2="270"/>
  <line class="line" x1="717" y1="254" x2="717" y2="270"/>
  <line class="line" x1="875" y1="254" x2="875" y2="270"/>

  <!-- Column headers -->
  <!-- Management -->
  <rect x="10" y="270" width="150" height="28" rx="6" fill="#9aa0a6"/>
  <text class="colhead" x="85" y="289" text-anchor="middle" fill="#ffffff">VLAN 1 VLAN 1 &#183; Management#183; 192.168.1.0/24</text>
  <!-- Trusted -->
  <rect x="168" y="270" width="150" height="28" rx="6" fill="#4285f4"/>
  <text class="colhead" x="243" y="289" text-anchor="middle" fill="#ffffff">VLAN 10 VLAN 10 &#183; Trusted#183; 192.168.10.0/24</text>
  <!-- Servers -->
  <rect x="326" y="270" width="150" height="28" rx="6" fill="#12a594"/>
  <text class="colhead" x="401" y="289" text-anchor="middle" fill="#ffffff">VLAN 20 VLAN 20 &#183; Servers#183; 192.168.20.0/24</text>
  <!-- IoT -->
  <rect x="484" y="270" width="150" height="28" rx="6" fill="#e0a200"/>
  <text class="colhead" x="559" y="289" text-anchor="middle" fill="#ffffff">VLAN 30 VLAN 30 &#183; IoT#183; 192.168.30.0/24</text>
  <!-- Guest -->
  <rect x="642" y="270" width="150" height="28" rx="6" fill="#e0a200"/>
  <text class="colhead" x="717" y="289" text-anchor="middle" fill="#ffffff">VLAN 40 VLAN 40 &#183; Guest#183; 192.168.40.0/24</text>
  <!-- Lab -->
  <rect x="800" y="270" width="150" height="28" rx="6" fill="#9334e6"/>
  <text class="colhead" x="875" y="289" text-anchor="middle" fill="#ffffff">VLAN 50 VLAN 50 &#183; Lab#183; 192.168.50.0/24</text>

  <!-- Management column content -->
  <g class="box mgmt">
    <rect x="10" y="308" width="150" height="116" rx="8"/>
    <text class="name" x="20" y="328">Infrastructure only</text>
    <text class="meta" x="20" y="345">Gateway, Pro XG switch,</text>
    <text class="meta" x="20" y="358">Flex 2.5G switch, both</text>
    <text class="meta" x="20" y="371">APs (control plane)</text>
    <text class="meta" x="20" y="390">No user devices &#183;</text>
    <text class="meta" x="20" y="403">admin access only</text>
  </g>

  <!-- Trusted column content -->
  <g class="box trusted">
    <rect x="168" y="308" width="150" height="36" rx="6"/>
    <text class="name" x="178" y="326">ASUS AP</text>
    <text class="meta" x="178" y="339">downstairs &#183; AP/bridge mode</text>
  </g>
  <g class="box trusted">
    <rect x="168" y="352" width="150" height="36" rx="6" stroke-dasharray="4 3"/>
    <text class="name" x="178" y="370">U7 Pro XG (optional)</text>
    <text class="meta" x="178" y="383">upstairs WiFi &#8212; TBD</text>
  </g>
  <g class="box trusted">
    <rect x="168" y="396" width="150" height="54" rx="6"/>
    <text class="name" x="178" y="414">Gaming PC + PS5</text>
    <text class="meta" x="178" y="427">via ASUS Gaming Port</text>
    <text class="meta" x="178" y="440">&#8594; upstairs switch</text>
  </g>
  <g class="box trusted">
    <rect x="168" y="458" width="150" height="36" rx="6"/>
    <text class="name" x="178" y="476">Family devices</text>
    <text class="meta" x="178" y="489">phones, laptops, TVs</text>
  </g>
  <g class="box trusted">
    <rect x="168" y="502" width="150" height="54" rx="6"/>
    <text class="name" x="178" y="520">Pi 1 &#8212; Pi-hole + VPN</text>
    <text class="meta" x="178" y="533">firewall: ufw</text>
    <text class="meta" x="178" y="546">DNS (53) open to all VLANs</text>
  </g>

  <!-- Servers column content -->
  <g class="box servers">
    <rect x="326" y="308" width="150" height="46" rx="6"/>
    <text class="name" x="336" y="327">UGREEN NAS</text>
    <text class="meta" x="336" y="341">firewall: UGOS (deny-all)</text>
  </g>
  <g class="box servers">
    <rect x="326" y="362" width="150" height="46" rx="6"/>
    <text class="name" x="336" y="381">Mini PC &#8212; Jellyfin</text>
    <text class="meta" x="336" y="395">firewall: Proxmox FW</text>
  </g>
  <g class="box servers">
    <rect x="326" y="416" width="150" height="46" rx="6"/>
    <text class="name" x="336" y="435">Pi 3 &#8212; Docker apps</text>
    <text class="meta" x="336" y="449">firewall: ufw</text>
  </g>
  <g class="box servers">
    <rect x="326" y="470" width="150" height="46" rx="6"/>
    <text class="name" x="336" y="489">Pi 4 &#8212; monitoring</text>
    <text class="meta" x="336" y="503">firewall: ufw</text>
  </g>

  <!-- IoT column (reserved) -->
  <g class="box reserved">
    <rect x="484" y="308" width="150" height="80" rx="6"/>
    <text class="name" x="494" y="330">Reserved</text>
    <text class="meta" x="494" y="346">future smart home /</text>
    <text class="meta" x="494" y="359">cameras</text>
    <text class="meta" x="494" y="376">internet-only, isolated</text>
  </g>

  <!-- Guest column (reserved) -->
  <g class="box reserved">
    <rect x="642" y="308" width="150" height="80" rx="6"/>
    <text class="name" x="652" y="330">Reserved</text>
    <text class="meta" x="652" y="346">future guest AP / SSID</text>
    <text class="meta" x="652" y="376">internet-only, isolated</text>
  </g>

  <!-- Lab column content -->
  <g class="box lab">
    <rect x="800" y="308" width="150" height="160" rx="8"/>
    <text class="name" x="810" y="328">Pi 2 &#8212; IDS sensor</text>
    <text class="meta" x="810" y="348">Suricata IDS (verified w/</text>
    <text class="meta" x="810" y="362">test-alert detection)</text>
    <text class="meta" x="810" y="386">firewall: nftables</text>
    <text class="meta" x="810" y="400">VLAN-tagged eth0.50</text>
    <text class="meta" x="810" y="420">fully isolated except</text>
    <text class="meta" x="810" y="433">internet &#8212; your sandbox</text>
    <text class="meta" x="810" y="453">feeds SIEM (planned)</text>
  </g>

  <!-- Firewall rules summary -->
  <rect x="10" y="590" width="940" height="118" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <text class="grouptitle" x="26" y="614">Network-layer rules (enforced on UCG-Fiber)</text>
  <text class="note" x="26" y="633">Trusted (192.168.10.0/24) Trusted &#8594; Servers: ALLOW &#160;&#183;&#160; Servers &#8594; Trusted: BLOCK &#160;&#183;&#160; IoT / Guest / Lab &#8594; any internal zone: BLOCK (internet only)#8594; Servers (192.168.20.0/24): ALLOW Trusted &#8594; Servers: ALLOW &#160;&#183;&#160; Servers &#8594; Trusted: BLOCK &#160;&#183;&#160; IoT / Guest / Lab &#8594; any internal zone: BLOCK (internet only)#183; Servers Trusted &#8594; Servers: ALLOW &#160;&#183;&#160; Servers &#8594; Trusted: BLOCK &#160;&#183;&#160; IoT / Guest / Lab &#8594; any internal zone: BLOCK (internet only)#8594; Trusted: BLOCK Trusted &#8594; Servers: ALLOW &#160;&#183;&#160; Servers &#8594; Trusted: BLOCK &#160;&#183;&#160; IoT / Guest / Lab &#8594; any internal zone: BLOCK (internet only)#183; IoT/Guest/Lab Trusted &#8594; Servers: ALLOW &#160;&#183;&#160; Servers &#8594; Trusted: BLOCK &#160;&#183;&#160; IoT / Guest / Lab &#8594; any internal zone: BLOCK (internet only)#8594; internal: BLOCK</text>
  <text class="note" x="26" y="650">Any VLAN Any zone &#8594; Pi 1 port 53: ALLOW (DNS exception so Pi-hole serves the whole network)#8594; Pi 1 (192.168.10.x) port 53 UDP: ALLOW Any zone &#8594; Pi 1 port 53: ALLOW (DNS exception so Pi-hole serves the whole network)#183; WireGuard: Internet Any zone &#8594; Pi 1 port 53: ALLOW (DNS exception so Pi-hole serves the whole network)#8594; Pi 1 port 51820 UDP: ALLOW</text>

  <text class="grouptitle" x="26" y="676">Host-layer firewalls (per device, defense in depth)</text>
  <text class="note" x="26" y="695">NAS: UGOS deny-all + allow-list &#160;&#183;&#160; Mini PC: Proxmox firewall &#160;&#183;&#160; Pi 1 / Pi 3 / Pi 4: ufw &#160;&#183;&#160; Pi 2: nftables (VLAN-aware)</text>

  <!-- Legend -->
  <line x1="10" y1="732" x2="950" y2="732" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="10"  y="748" width="13" height="13" rx="3" fill="#9aa0a6"/>
  <text class="meta" x="29"  y="759">Management</text>
  <rect x="118" y="748" width="13" height="13" rx="3" fill="#4285f4"/>
  <text class="meta" x="137" y="759">Trusted</text>
  <rect x="206" y="748" width="13" height="13" rx="3" fill="#12a594"/>
  <text class="meta" x="225" y="759">Servers</text>
  <rect x="294" y="748" width="13" height="13" rx="3" fill="#e0a200"/>
  <text class="meta" x="313" y="759">IoT / Guest (reserved)</text>
  <rect x="450" y="748" width="13" height="13" rx="3" fill="#9334e6"/>
  <text class="meta" x="469" y="759">Lab (isolated sandbox)</text>

  <text class="note" x="10" y="787">PC and PS5 connect via the ASUS&#8217;s wired Gaming Port to an upstairs switch &#8212; single NAT, full UniFi visibility, PS5 stays Open NAT.</text>
</svg>
