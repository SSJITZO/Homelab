<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #202124; }
    .sub   { font-size: 12px; fill: #5f6368; }
    .t     { font-size: 13px; font-weight: 600; }
    .s     { font-size: 11px; fill: #5f6368; }
    .u     { font-size: 11px; font-weight: 600; fill: #80868b; }
    .ulab  { font-size: 9.5px; fill: #9aa0a6; text-anchor: end; }
    .grouptitle { font-size: 12.5px; font-weight: 700; fill: #3c4043; }
    .note  { font-size: 11px; fill: #80868b; }
    .screen     { fill: #f3e8fd; stroke: #9334e6; }
    .screen .t  { fill: #4a0e8f; }
    .compute    { fill: #e8f0fe; stroke: #4285f4; }
    .compute .t { fill: #174ea6; }
    .net        { fill: #e0f7f3; stroke: #12a594; }
    .net .t     { fill: #0b5e54; }
    .power      { fill: #e7f6ea; stroke: #34a853; }
    .power .t   { fill: #1e5631; }
    .infra      { fill: #eef0f2; stroke: #9aa0a6; }
    .infra .t   { fill: #3c4043; }
    .ontop      { fill: #fdeceb; stroke: #ea6b5e; }
    .ontop .t   { fill: #8a2c22; }
    .elsewhere  { fill: #fef6e0; stroke: #e0a200; }
    .elsewhere .t { fill: #7a5900; }
    .floor      { fill: #e7f6ea; stroke: #34a853; }
    .floor .t   { fill: #1e5631; }
    .box rect { stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="780" height="700" fill="#ffffff"/>
  <text class="title" x="40" y="38">Homelab — 12U 10-inch rack build</text>
  <text class="sub"   x="40" y="56">GeeekPi 12U · DeskPi RackMate T2 · 10.23&#8243; depth</text>

  <!-- Rack frame -->
  <rect x="40" y="74" width="344" height="540" rx="12" fill="none" stroke="#bdc1c6" stroke-width="1.5"/>

  <!-- U labels -->
  <text class="ulab" x="35" y="131">U12&#8211;11</text>
  <text class="ulab" x="35" y="196">U10</text>
  <text class="ulab" x="35" y="262">U9&#8211;8</text>
  <text class="ulab" x="35" y="325">U7</text>
  <text class="ulab" x="35" y="368">U6</text>
  <text class="ulab" x="35" y="411">U5</text>
  <text class="ulab" x="35" y="454">U4</text>
  <text class="ulab" x="35" y="497">U3</text>
  <text class="ulab" x="35" y="540">U2</text>
  <text class="ulab" x="35" y="583">U1</text>

  <!-- U12-11 Screen 2U -->
  <g class="box screen">
    <rect x="52" y="88" width="320" height="83" rx="6"/>
    <text class="t" x="64" y="122">GeeekPi 7.84&#8243; 1280&#215;400 Touch Screen</text>
    <text class="s" x="64" y="139">2U rack-mount monitor &#183; console + dashboards</text>
    <text class="s" x="64" y="155">HDMI from mini PC &#183; touchscreen</text>
    <text class="u" x="360" y="133" text-anchor="end">2U</text>
  </g>

  <!-- U10 Patch panel -->
  <g class="box infra">
    <rect x="52" y="174" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="192">Patch panel (0.5U) + cable mgmt (0.5U)</text>
    <text class="s" x="64" y="206">GeeekPi 12-port &#183; 12&#215; keystone jacks</text>
    <text class="u" x="360" y="198" text-anchor="end">1U</text>
  </g>

  <!-- U9-8 Raspberry Pi 5 x4 -->
  <g class="box compute">
    <rect x="52" y="217" width="320" height="83" rx="6"/>
    <text class="t" x="64" y="250">Raspberry Pi 5 &#215;4  (GeeekPi 2U mount)</text>
    <text class="s" x="64" y="267">VLAN lab &#183; Pi-hole+VPN &#183; apps &#183; monitoring</text>
    <text class="s" x="64" y="283">each with active cooler + NVMe SSD</text>
    <text class="u" x="360" y="260" text-anchor="end">2U</text>
  </g>

  <!-- U7 Mini PC -->
  <g class="box compute">
    <rect x="52" y="303" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="321">Mini PC / Kamrui  &#183;  shelf</text>
    <text class="s" x="64" y="335">Jellyfin + Proxmox host</text>
    <text class="u" x="360" y="327" text-anchor="end">1U</text>
  </g>

  <!-- U6 JetKVM — directly below mini PC -->
  <g class="box infra">
    <rect x="52" y="346" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="364">JetKVM  &#183;  1U mount</text>
    <text class="s" x="64" y="378">IP console &#8594; mini PC above &#183; short HDMI + USB</text>
    <text class="u" x="360" y="370" text-anchor="end">1U</text>
  </g>

  <!-- U7+U6 bracket showing they connect -->
  <line x1="383" y1="310" x2="395" y2="310" stroke="#4285f4" stroke-width="1.5"/>
  <line x1="395" y1="310" x2="395" y2="370" stroke="#4285f4" stroke-width="1.5"/>
  <line x1="395" y1="370" x2="383" y2="370" stroke="#4285f4" stroke-width="1.5"/>
  <text style="font-size:9px;fill:#4285f4;" x="398" y="344">HDMI</text>
  <text style="font-size:9px;fill:#4285f4;" x="398" y="355">+ USB</text>

  <!-- U5 UCG-Fiber -->
  <g class="box net">
    <rect x="52" y="389" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="407">UniFi UCG-Fiber gateway  &#183;  shelf</text>
    <text class="s" x="64" y="421">routing &#183; VLANs &#183; IDS/IPS &#183; controller</text>
    <text class="u" x="360" y="413" text-anchor="end">1U</text>
  </g>

  <!-- U4 Pro XG 8 PoE -->
  <g class="box net">
    <rect x="52" y="432" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="450">UniFi Pro XG 8 PoE  &#183;  shelf</text>
    <text class="s" x="64" y="464">10G core switch &#183; PoE++ &#183; managed VLANs</text>
    <text class="u" x="360" y="456" text-anchor="end">1U</text>
  </g>

  <!-- U3 Flex 2.5G -->
  <g class="box net">
    <rect x="52" y="475" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="493">UniFi Flex 2.5G PoE  &#183;  shelf</text>
    <text class="s" x="64" y="507">access switch &#183; 4&#215; Pis + JetKVM (gigabit)</text>
    <text class="u" x="360" y="499" text-anchor="end">1U</text>
  </g>

  <!-- U2 Fan panel -->
  <g class="box infra">
    <rect x="52" y="518" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="536">Cooling fan panel</text>
    <text class="s" x="64" y="550">rack airflow</text>
    <text class="u" x="360" y="542" text-anchor="end">1U</text>
  </g>

  <!-- U1 PDU -->
  <g class="box power">
    <rect x="52" y="561" width="320" height="40" rx="6"/>
    <text class="t" x="64" y="579">PDU + cable panel</text>
    <text class="s" x="64" y="593">power distribution &#183; fed from floor UPS</text>
    <text class="u" x="360" y="585" text-anchor="end">1U</text>
  </g>

  <!-- RIGHT COLUMN -->
  <text class="grouptitle" x="432" y="92">On top of the rack</text>

  <g class="box ontop">
    <rect x="432" y="102" width="308" height="54" rx="8"/>
    <text class="t" x="446" y="126">UGREEN DXP4800 Plus &#8212; NAS</text>
    <text class="s" x="446" y="142">4-bay &#183; HDDs + NVMe cache + RAM</text>
  </g>

  <g class="box ontop">
    <rect x="432" y="162" width="308" height="54" rx="8"/>
    <text class="t" x="446" y="186">AISHICHEN 8.8&#8243; bar screen</text>
    <text class="s" x="446" y="202">secondary Grafana kiosk &#183; 1920&#215;480</text>
  </g>

  <g class="box ontop">
    <rect x="432" y="222" width="308" height="54" rx="8"/>
    <text class="t" x="446" y="246">ASUS GT-BE19000AI</text>
    <text class="s" x="446" y="262">downstairs WiFi AP (AP mode)</text>
  </g>

  <!-- Elsewhere -->
  <text class="grouptitle" x="432" y="306">Elsewhere in the house</text>

  <g class="box elsewhere">
    <rect x="432" y="316" width="308" height="54" rx="8"/>
    <text class="t" x="446" y="340">UniFi U7 Pro XG &#8212; access point</text>
    <text class="s" x="446" y="356">WiFi 7 upstairs &#183; fed via room LAN jack</text>
  </g>

  <g class="box elsewhere">
    <rect x="432" y="376" width="308" height="54" rx="8"/>
    <text class="t" x="446" y="400">AT&amp;T BGW320</text>
    <text class="s" x="446" y="416">ISP gateway &#183; fiber entry &#8594; UCG-Fiber</text>
  </g>

  <!-- Floor -->
  <text class="grouptitle" x="432" y="460">On the floor, beside the rack</text>

  <g class="box floor">
    <rect x="432" y="470" width="308" height="54" rx="8"/>
    <text class="t" x="446" y="494">CyberPower CP1500PFCLCD &#8212; UPS</text>
    <text class="s" x="446" y="510">1500VA/1000W &#183; USB&#8594;NAS &#183; feeds rack PDU</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="638" x2="744" y2="638" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="40"  y="650" width="12" height="12" rx="2" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
  <text class="s" x="57"  y="660">Screen</text>
  <rect x="120" y="650" width="12" height="12" rx="2" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text class="s" x="137" y="660">Compute</text>
  <rect x="226" y="650" width="12" height="12" rx="2" fill="#e0f7f3" stroke="#12a594" stroke-width="1.5"/>
  <text class="s" x="243" y="660">Networking</text>
  <rect x="342" y="650" width="12" height="12" rx="2" fill="#e7f6ea" stroke="#34a853" stroke-width="1.5"/>
  <text class="s" x="359" y="660">Power</text>
  <rect x="420" y="650" width="12" height="12" rx="2" fill="#eef0f2" stroke="#9aa0a6" stroke-width="1.5"/>
  <text class="s" x="437" y="660">Infrastructure</text>
  <rect x="548" y="650" width="12" height="12" rx="2" fill="#fdeceb" stroke="#ea6b5e" stroke-width="1.5"/>
  <text class="s" x="565" y="660">On top</text>
  <rect x="634" y="650" width="12" height="12" rx="2" fill="#fef6e0" stroke="#e0a200" stroke-width="1.5"/>
  <text class="s" x="651" y="660">Elsewhere</text>
</svg>
