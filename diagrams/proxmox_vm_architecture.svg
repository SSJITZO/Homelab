<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title   { font-size: 22px; font-weight: 700; fill: #202124; }
    .sub     { font-size: 12.5px; fill: #5f6368; }
