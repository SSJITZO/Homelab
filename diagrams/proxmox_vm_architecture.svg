  <!-- Legend + footer -->
  <rect x="30" y="750" width="1020" height="120" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <text class="grouptitle" x="46" y="774">How this connects to the SIEM</text>
  <text class="note" x="46" y="794">Pi 1 (Pi-hole DNS logs), Pi 2 (Suricata alerts), the AD domain controller, and the Kali/target attack traffic all ship</text>
  <text class="note" x="46" y="810">into the SIEM VM once Build 1 exists — see the separate SIEM &amp; Log Flow diagram for that data path in detail.</text>
  <text class="note" x="46" y="832">Sizing note: with Jellyfin + SIEM + AD + Kali + target all running, budget roughly 20-24GB RAM allocated across guests —</text>
  <text class="note" x="46" y="848">comfortable headroom on the Kamrui's 32GB. Stop/suspend VMs you're not actively using to keep things responsive.</text>

  <rect x="30" y="882" width="14" height="14" rx="3" class="done"/>
  <text class="vmmeta" x="50" y="893">Already running</text>
