<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 920" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title   { font-size: 22px; font-weight: 700; fill: #202124; }
    .sub     { font-size: 12.5px; fill: #5f6368; }
    .hosttitle { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .hostmeta  { font-size: 11px; fill: #d2e3fc; }
    .vmtitle { font-size: 12.5px; font-weight: 700; }
    .vmmeta  { font-size: 10px; fill: #5f6368; }
    .tag     { font-size: 8.5px; font-weight: 700; fill: #ffffff; }
    .grouptitle { font-size: 13px; font-weight: 700; fill: #3c4043; }
    .note    { font-size: 10.5px; fill: #5f6368; }
    .card rect { stroke-width: 1.5; }
    .done    { fill: #e7f6ea; stroke: #34a853; }
    .todo    { fill: #fef3e0; stroke: #f4a000; }
    .info    { fill: #eef0f2; stroke: #9aa0a6; }
  </style>

  <rect x="0" y="0" width="1080" height="920" fill="#ffffff"/>
  <text class="title" x="30" y="34">Proxmox VE — VM architecture</text>
  <text class="sub"   x="30" y="53">What actually runs on the hypervisor today, and the build order for everything planned on top of it.</text>

  <!-- Host bar -->
  <rect x="30" y="70" width="1020" height="46" rx="8" fill="#1a73e8"/>
  <text class="hosttitle" x="46" y="92">Proxmox VE host — KAMRUI Hyper H2 (i5-14450HX, 32GB RAM, 1TB NVMe) — 192.168.20.10</text>
  <text class="hostmeta"  x="46" y="108">VLAN 20 (Servers) &#183; managed via JetKVM for out-of-band console access</text>

  <!-- ROW 1: what's actually here -->
  <text class="grouptitle" x="30" y="146">Running on this host today</text>

  <g class="card done"><rect x="30" y="156" width="330" height="78" rx="8"/>
    <text class="vmtitle" x="42" y="178" fill="#1e5631">NAS storage (mounted)</text>
    <text class="vmmeta" x="42" y="194">SMB/CIFS &#8594; UGREEN DXP4800+</text>
    <text class="vmmeta" x="42" y="208">Datacenter &#8594; Storage &#8594; Add SMB/CIFS</text>
    <rect x="42" y="216" width="52" height="16" rx="8" fill="#34a853"/><text class="tag" x="68" y="227" text-anchor="middle">DONE</text>
  </g>

  <text class="note" x="380" y="180">That's it so far — this host is set up and storage-integrated, but no</text>
  <text class="note" x="380" y="196">workload VMs have been built on it yet. Everything below is the plan.</text>
  <text class="note" x="380" y="218">Media (Jellyfin, Jellyseerr) runs in Docker directly on the NAS, not here —</text>
  <text class="note" x="380" y="234">this host is reserved for the security/cloud build, so it stays uncluttered.</text>

  <!-- ROW 2: SOC build -->
  <text class="grouptitle" x="30" y="272">Security / SOC build &#8212; build in order (1 &#8594; 2 &#8594; 3)</text>

  <g class="card todo"><rect x="30" y="282" width="240" height="130" rx="8"/>
    <text class="vmtitle" x="42" y="304" fill="#7a5900">1. SIEM (Wazuh)</text>
    <text class="vmmeta" x="42" y="320">Ubuntu Server, 4vCPU/8GB</text>
    <text class="vmmeta" x="42" y="334">Collects all logs, alert triage</text>
    <rect x="42" y="344" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="72" y="355" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="42" y="376">&#127942; Security+ &#183; CySA+ &#183; Cloud+</text>
    <text class="vmmeta" x="42" y="390">(security domain)</text>
  </g>

  <g class="card todo"><rect x="280" y="282" width="240" height="130" rx="8"/>
    <text class="vmtitle" x="292" y="304" fill="#7a5900">2. Windows Server + AD</text>
    <text class="vmmeta" x="292" y="320">Server 2022 Eval, 2vCPU/4GB</text>
    <text class="vmmeta" x="292" y="334">Domain, users, GPOs</text>
    <rect x="292" y="344" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="322" y="355" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="292" y="376">&#127942; Security+ &#183; Network+</text>
    <text class="vmmeta" x="292" y="390">Oracle IAM Analyst path</text>
  </g>

  <g class="card todo"><rect x="530" y="282" width="240" height="130" rx="8"/>
    <text class="vmtitle" x="542" y="304" fill="#7a5900">3a. Kali Linux</text>
    <text class="vmmeta" x="542" y="320">Attacker VM &#8212; Lab VLAN 50</text>
    <text class="vmmeta" x="542" y="334">nmap, Metasploit</text>
    <rect x="542" y="344" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="572" y="355" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="542" y="376">&#127942; Security+ &#183; PenTest+ (opt.)</text>
    <text class="vmmeta" x="542" y="390">Portfolio centerpiece</text>
  </g>

  <g class="card todo"><rect x="780" y="282" width="270" height="130" rx="8"/>
    <text class="vmtitle" x="792" y="304" fill="#7a5900">3b. Metasploitable2 (target)</text>
    <text class="vmmeta" x="792" y="320">Vulnerable target &#8212; Lab VLAN 50</text>
    <text class="vmmeta" x="792" y="334">the &#8220;victim&#8221; for the attack loop</text>
    <rect x="792" y="344" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="822" y="355" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="792" y="376">&#127942; Security+ &#183; detected by Pi 2</text>
    <text class="vmmeta" x="792" y="390">&#8594; feeds SIEM &#8594; MITRE ATT&amp;CK write-up</text>
  </g>

  <!-- ROW 3: Cloud+ build -->
  <text class="grouptitle" x="30" y="446">Cloud+ build &#8212; independent, any order</text>

  <g class="card todo"><rect x="30" y="456" width="360" height="110" rx="8"/>
    <text class="vmtitle" x="42" y="478" fill="#7a5900">k3s cluster (Kubernetes)</text>
    <text class="vmmeta" x="42" y="494">2&#8211;3 lightweight VMs, or reuse Pi 3/4</text>
    <text class="vmmeta" x="42" y="508">Container orchestration</text>
    <rect x="42" y="518" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="72" y="529" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="42" y="550">&#127942; Cloud+ (containerization &#8212; now core)</text>
  </g>

  <g class="card todo"><rect x="410" y="456" width="330" height="110" rx="8"/>
    <text class="vmtitle" x="422" y="478" fill="#7a5900">Terraform (IaC)</text>
    <text class="vmmeta" x="422" y="494">Runs from your laptop &#8594; Proxmox API</text>
    <text class="vmmeta" x="422" y="508">Defines/applies VMs as code</text>
    <rect x="422" y="518" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="452" y="529" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="422" y="550">&#127942; Cloud+ (Infrastructure as Code)</text>
  </g>

  <g class="card todo"><rect x="760" y="456" width="290" height="110" rx="8"/>
    <text class="vmtitle" x="772" y="478" fill="#7a5900">Proxmox API token</text>
    <text class="vmmeta" x="772" y="494">Datacenter &#8594; Permissions &#8594; API Tokens</text>
    <text class="vmmeta" x="772" y="508">Auth for Terraform &amp; automation</text>
    <rect x="772" y="518" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="802" y="529" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="772" y="550">&#127942; supports Cloud+ IaC build</text>
  </g>

  <!-- Cloud/hybrid section -->
  <text class="grouptitle" x="30" y="610">Public / hybrid cloud &#8212; off-Proxmox, but linked to it</text>

  <g class="card todo"><rect x="30" y="620" width="330" height="110" rx="8"/>
    <text class="vmtitle" x="42" y="642" fill="#7a5900">Azure or AWS free-tier VM</text>
    <text class="vmmeta" x="42" y="658">B1S / t3.micro, WireGuard site-to-site</text>
    <text class="vmmeta" x="42" y="672">tunnels back to Pi 1</text>
    <rect x="42" y="682" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="72" y="693" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="42" y="714">&#127942; Cloud+ (public/hybrid cloud domain)</text>
  </g>

  <g class="card todo"><rect x="380" y="620" width="330" height="110" rx="8"/>
    <text class="vmtitle" x="392" y="642" fill="#7a5900">OCI Always-Free instance</text>
    <text class="vmmeta" x="392" y="658">ARM Ampere A1, mirrors a service</text>
    <text class="vmmeta" x="392" y="672">Genuinely permanent free tier</text>
    <rect x="392" y="682" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="422" y="693" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="392" y="714">&#127942; Oracle track (OCI Foundations Assoc.)</text>
  </g>

  <g class="card todo"><rect x="730" y="620" width="320" height="110" rx="8"/>
    <text class="vmtitle" x="742" y="642" fill="#7a5900">Cisco Packet Tracer</text>
    <text class="vmmeta" x="742" y="658">Recreates this whole topology</text>
    <text class="vmmeta" x="742" y="672">in Cisco IOS syntax (own laptop)</text>
    <rect x="742" y="682" width="60" height="15" rx="7" fill="#f4a000"/><text class="tag" x="772" y="693" text-anchor="middle">TODO</text>
    <text class="vmmeta" x="742" y="714">&#127942; Network+ &#183; CCNA (CLI fluency)</text>
  </g>

  <!-- Legend + footer -->
  <rect x="30" y="758" width="1020" height="130" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <text class="grouptitle" x="46" y="782">How this will connect to the SIEM</text>
  <text class="note" x="46" y="802">Pi 1 (Pi-hole DNS logs), Pi 2 (Suricata alerts), the AD domain controller, and the Kali/target attack traffic all ship</text>
  <text class="note" x="46" y="818">into the SIEM VM once Build 1 exists — see the separate SIEM &amp; Log Flow diagram for that data path in detail.</text>
  <text class="note" x="46" y="840">Sizing note: with SIEM + AD + Kali + target all running, budget roughly 16-20GB RAM allocated across guests —</text>
  <text class="note" x="46" y="856">comfortable headroom on the Kamrui's 32GB, with plenty left over for k3s nodes. Stop/suspend VMs you're not using to stay responsive.</text>
  <text class="note" x="46" y="878">Nothing on this host is internet-facing — remote access to anything here goes through the WireGuard tunnel on Pi 1, never a forwarded port.</text>

  <rect x="30" y="898" width="14" height="14" rx="3" class="done"/>
  <text class="vmmeta" x="50" y="909">Running today</text>
  <rect x="180" y="898" width="14" height="14" rx="3" class="todo"/>
  <text class="vmmeta" x="200" y="909">Planned / to build</text>
</svg>
